<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fb; }
      .container { max-width: 700px; margin: 0 auto; }
      form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      input, button { padding: 0.75rem; font-size: 1rem; }
      input[type="text"] { flex: 1; }
      button { background: #2563eb; color: white; border: none; cursor: pointer; }
      #messages { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      .msg { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
      .meta { color: #64748b; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Chat App</h1>
      <form id="chatForm">
        <input id="user" type="text" placeholder="Your name" value="Guest" />
        <input id="message" type="text" placeholder="Type a message" />
        <button type="submit">Send</button>
      </form>
      <div id="messages"></div>
    </div>

    <script>
      async function loadMessages() {
        const res = await fetch('/api/chat-history');
        const messages = await res.json();
        const el = document.getElementById('messages');
        el.innerHTML = messages.map(msg => `
          <div class="msg">
            <div><strong>${msg.user}</strong> <span class="meta">${new Date(msg.created_at).toLocaleString()}</span></div>
            <div>${msg.message}</div>
          </div>
        `).join('');
      }

      document.getElementById('chatForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = document.getElementById('user').value;
        const message = document.getElementById('message').value;
        if (!message.trim()) return;

        await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, message })
        });

        document.getElementById('message').value = '';
        await loadMessages();
      });

      loadMessages();
    </script>
  </body>
</html>
