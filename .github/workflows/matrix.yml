name: Python Matrix

on:
  push:

jobs:
  test-python:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version
        run: python --version

      - name: Print operating system
        run: echo "Running on ${{ matrix.os }}"